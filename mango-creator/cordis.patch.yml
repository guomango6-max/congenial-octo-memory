# Mango Creator — agent preset
#
# 基底: 官方 standard (packages/bundle/web-app/presets/standard.patch.yml)
# 按工作流做的增删见文件末尾的「与 standard 的差异」。
#
# 装法: plugin_manager, action: install_bundle, target 填这个目录的绝对路径。
#       它自己会做包安装和 bundle 选择,不要用 shell 手动走。
#
# ⚠️ 改名注意: config.name 是 UI 显示名,随便改。config.id 是会话记录的 preset
#    身份 —— 已有会话恢复时按它找定义,找不到直接拒绝恢复。如果你是要把一个
#    已经用过的 preset 改名(比如原来的 jacky-creator),把下面的 config.id
#    换回它原本的值,只留 config.name 为 Mango Creator。

- insert:
    - id: preset-mango-creator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mango-creator
        name: Mango Creator
        description: 读仓库、跑脚本、写文档。小改直接做,大改先问。
        order: 10

        plugins:
          # ---------- persona: 工作流写在这里 ----------
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是由 {{model}} 驱动的助手。用中文回答。

                这个 preset 的三类典型任务:
                1. 读仓库、把代码和结构讲清楚 —— 这是最常见的一类。先搜再读,
                   用 grep / glob 定位,只读需要的片段,不要整文件灌进上下文。
                   结论要落到具体文件和行号上,不要凭印象概述。
                2. 跑脚本、处理数据 —— 用 shell 做实际的事。长输出先过滤再看,
                   不要把几千行原样读回来。
                3. 写文档、查资料 —— 需要外部事实时联网查,不要靠记忆回答
                   版本号、价格、API 形状这类会过期的东西。

                动手的分寸:
                - 小改直接做。改一个函数、补一个测试、修个 typo、调个配置,
                  不要先问,做完说一句改了什么。
                - 大改先问。动公开接口或数据结构、跨多个文件重构、删文件、
                  改构建或 CI、碰 git 历史,先说清方案等确认。
                - 分不清大小就按大的算。
                - 有歧义时用 ask_user_question 问,但只问我才能决定的事;
                  代码在哪、现在怎么跑的,自己去查。

                报告口径:
                - 查到的就说查到,没验证的说清是推测。
                - 测试失败就贴输出,不要含糊成"基本可以"。
                - 跳过了什么、为什么跳过,明确说。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ---------- shell: 跑脚本/处理数据 ----------
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ---------- 文件读写 + 搜索: 读仓库的主力 ----------
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # true 会在 edit 旁边多一个 apply_patch 工具
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ---------- skill: office skill 要靠它才能加载 ----------
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ---------- 大改先问 ----------
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ---------- 长任务: 自动压缩历史接着跑 ----------
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ---------- 查资料 ----------
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ---------- 写文档 ----------
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'

# ===========================================================================
# 与官方 standard 的差异
#
# 去掉的:
#   plan-mode        你选了「小改直接做,大改先问」,plan-mode 是另一种路线
#                    (任何改动都先出计划等批),两者冲突。约束改成写在 persona 里。
#   delegation 组    tool-subagent / tool-subagent-fork / workflow-ptc /
#                    tool-workflow。你没选「拆给 subagent 并行」。
#   tool-jobs        没选「后台 job / 定时」。
#   tool-schedule    同上。
#   tool-todo        没选「用 todo 跟进度」。
#   command-goal     goal 和 todo 是一类东西,一起去掉保持一致。
#   tool-goal
#   plugin-manager   standard 里有,但那是用来改 dsh 自己的,不在你的工作流里。
#   plugin-market
#
# 保留但值得知道的:
#   tool-office      office_render / office_convert / office_recalculate。
#                    office-kit 和 skill-office 挂在 web-app bundle(host 层),
#                    已经在了,preset 这边只需要 tool-office。
#   tool-web         web-search-deepseek 和 web-fetch-http 在 base bundle,
#                    host 层已有,preset 只需要 tool-web。
#
# 没放进来、因为不属于 preset 管的:
#   权限/审批        sandbox-policy(默认 workspace-write)、user-approval
#                    (默认 ask)、permission-presets 都在 base bundle 的 host 层。
#                    「读放开,写和 shell 要批」就是出厂默认,不用配。
#                    要临时切:/permission read-only|workspace-write|danger-full-access
#
# 想加回来的话(各 2-4 行):
#   todo:       - id: tool-todo
#                 name: '@deepseek-ai/dsh-tool-todo'
#                 config: { allowParallelInProgress: true }
#   定时/后台:  - id: tool-jobs
#                 name: '@deepseek-ai/dsh-tool-jobs'
#               - id: tool-schedule
#                 name: '@deepseek-ai/dsh-tool-schedule'
#   改 dsh 自己: 把官方 cordis.patch.yml 里的 tool-cordis、tool-plugin-manager
#               两行抄过来(这才是真正的 Creator mode 能力)。
#
# 验证: plugin_manager list_bundles 看 bundle,list_plugins 看
#       preset-mango-creator 行的激活状态;或直接看 Plugins 页。
#       激活失败的声明会留在列表里带诊断。已有会话保留启动时的版本,要新开会话。
